<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    body { margin: 0; padding: 4px 4px 16px; font-size: 13px; color: #202124; background: #fff; }
    .summary { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-weight: 500; background: #e8f0fe; color: #1a73e8; }
    .summary.good { background: #e6f4ea; color: #137333; }
    .summary.todo { background: #fef7e0; color: #b06000; }
    .section { border: 1px solid #dadce0; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .head { display: flex; align-items: center; gap: 8px; }
    .icon { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
    .icon.ok { background: #e6f4ea; color: #137333; }
    .icon.ko { background: #fce8e6; color: #c5221f; font-weight: 700; }
    .title { font-weight: 500; flex: 1; }
    .ok-text { font-size: 12px; color: #5f6368; margin: 4px 0 0 28px; }
    ul { margin: 6px 0 0 28px; padding-left: 16px; }
    li { margin: 2px 0; }
    .btn { background: #f1f3f4; border: 1px solid #dadce0; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: #3c4043; flex: none; }
    .btn:hover { background: #e8eaed; }
    .btn.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    .msg { font-size: 12px; margin: 0 0 10px; color: #1a73e8; min-height: 16px; }
    .footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="summary" class="summary"></div>
  <div id="msg" class="msg"></div>
  <div id="sections"></div>
  <div class="footer">
    <button class="btn" onclick="recheck()">Check again</button>
    <button class="btn primary" onclick="google.script.host.close()">Close</button>
  </div>

  <script>
    var report = <?!= reportJson ?>;
    var ACTIONS = {
      members: { label: 'Open Contracts', fn: 'showContractsTab' },
      formulas: { label: 'Restore formulas', fn: 'restoreMemberFormulas' },
      backups: { label: 'Add interim backups', fn: 'showBackupSidebar' },
      presence: { label: 'Declare Presence', fn: 'showBaselineSidebar' },
      dedupe: { label: 'Remove duplicates', fn: 'removePresenceDuplicates' },
      calendar: { label: 'Open Calendar', fn: 'showTaskCalendar' }
    };

    function $(id) { return document.getElementById(id); }
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

    function render() {
      var s = $('summary');
      s.className = 'summary ' + (report.issues ? 'todo' : 'good');
      s.textContent = report.issues ? report.issues + ' item(s) need attention (' + report.asOf + ')' : 'All good (' + report.asOf + ')';
      var box = $('sections'); box.innerHTML = '';
      report.sections.forEach(function(sec) {
        var card = el('div', 'section');
        var head = el('div', 'head');
        head.appendChild(el('span', 'icon ' + (sec.items.length ? 'ko' : 'ok'), sec.items.length ? String(sec.items.length) : '✓'));
        head.appendChild(el('span', 'title', sec.title));
        if (sec.items.length && sec.action && ACTIONS[sec.action]) {
          var b = el('button', 'btn', ACTIONS[sec.action].label);
          b.onclick = function() { act(sec.action, b); };
          head.appendChild(b);
        }
        card.appendChild(head);
        if (sec.items.length) {
          var ul = el('ul');
          sec.items.forEach(function(it) { ul.appendChild(el('li', '', it)); });
          card.appendChild(ul);
        } else {
          card.appendChild(el('div', 'ok-text', sec.ok));
        }
        box.appendChild(card);
      });
    }

    function act(key, button) {
      var a = ACTIONS[key];
      button.disabled = true;
      $('msg').textContent = 'Working…';
      google.script.run
        .withSuccessHandler(function(res) {
          if (key === 'dedupe' || key === 'formulas') recheck((res && res.message) || 'Done.');
          else google.script.host.close();
        })
        .withFailureHandler(function(err) { button.disabled = false; $('msg').textContent = err.message || String(err); })[a.fn]();
    }

    function recheck(doneMsg) {
      $('msg').textContent = 'Checking…';
      google.script.run
        .withSuccessHandler(function(res) { report = res; render(); $('msg').textContent = typeof doneMsg === 'string' ? doneMsg : ''; })
        .withFailureHandler(function(err) { $('msg').textContent = err.message || String(err); })
        .runWorkspaceCheck();
    }

    // The dialog opens at once; the check runs in the background
    if (report) render();
    else {
      $('summary').className = 'summary';
      $('summary').textContent = 'Checking the workspace… this can take up to half a minute.';
      recheck();
    }
  </script>
</body>
</html>
